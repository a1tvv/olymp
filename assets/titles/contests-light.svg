<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="Контесты">
<defs></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="2" y="62" font-size="54" font-weight="700" letter-spacing="-1.2" fill="#1d1d1f">Контесты</text>
<text x="3" y="104" font-size="25" font-weight="500" fill="#6e6e73">Нажми на задачу — откроется условие, на «Код» — решение.</text>
<text x="3" y="138" font-size="25" font-weight="500" fill="#6e6e73">«Решена» — проходит все примеры из условия.</text>
