<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Разборы: A, B, C, D">
<defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161618"/><stop offset="1" stop-color="#000000"/></linearGradient><linearGradient id="gdone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#1e9e47"/></linearGradient><linearGradient id="gdraft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb340"/><stop offset="1" stop-color="#d26a00"/></linearGradient><linearGradient id="gsoon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c7c80"/><stop offset="1" stop-color="#3a3a3c"/></linearGradient></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="589" height="329" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><rect x="32" y="32" width="64" height="64" rx="16.64" fill="url(#gdone)"/><rect x="32.5" y="32.5" width="63" height="63" rx="16.64" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><text x="64.0" y="75.52" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">A</text><text x="116" y="60" font-size="26" font-weight="600" fill="#f5f5f7">Немного истории</text><text x="116" y="90" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#86868b">O(1)</text><circle cx="40" cy="139" r="4" fill="#30d158"/><text x="58" y="146" font-size="21" font-weight="500" fill="#d1d1d6"><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">ICPC Regional</tspan><tspan> — каждый год с 2005-го</tspan></text><circle cx="40" cy="177" r="4" fill="#30d158"/><text x="58" y="184" font-size="21" font-weight="500" fill="#d1d1d6"><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">ICPC Qual</tspan><tspan> — с 2019-го, кроме 2020 и 2021</tspan></text><circle cx="40" cy="215" r="4" fill="#30d158"/><text x="58" y="222" font-size="21" font-weight="500" fill="#d1d1d6"><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">School Regional</tspan><tspan> и </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">School Qual</tspan><tspan> — в 2026-м</tspan></text><circle cx="40" cy="253" r="4" fill="#30d158"/><text x="58" y="260" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Хватает трёх условий на год</tspan></text><rect x="610.5" y="0.5" width="589" height="329" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><rect x="642" y="32" width="64" height="64" rx="16.64" fill="url(#gdone)"/><rect x="642.5" y="32.5" width="63" height="63" rx="16.64" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><text x="674.0" y="75.52" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">B</text><text x="726" y="60" font-size="26" font-weight="600" fill="#f5f5f7">Ответственная стирка</text><text x="726" y="90" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#86868b">O(N)</text><circle cx="650" cy="139" r="4" fill="#30d158"/><text x="668" y="146" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Все носки — одна стирка</tspan></text><circle cx="650" cy="177" r="4" fill="#30d158"/><text x="668" y="184" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Яркие цвета и белый — каждый отдельно,</tspan></text><text x="668" y="222" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>тёмные (чёрный, синий, серый) — вместе</tspan></text><circle cx="650" cy="253" r="4" fill="#30d158"/><text x="668" y="260" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Майки — одна стирка на цветовую группу</tspan></text><circle cx="650" cy="291" r="4" fill="#30d158"/><text x="668" y="298" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Кофты и штаны — </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">⌈k/2⌉</tspan><tspan> стирок на группу</tspan></text><rect x="0.5" y="350.5" width="589" height="329" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><rect x="32" y="382" width="64" height="64" rx="16.64" fill="url(#gdraft)"/><rect x="32.5" y="382.5" width="63" height="63" rx="16.64" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><text x="64.0" y="425.52" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><text x="116" y="410" font-size="26" font-weight="600" fill="#f5f5f7">Сизифов труд</text><text x="116" y="440" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#ff9f0a">черновик</text><circle cx="40" cy="489" r="4" fill="#ff9f0a"/><text x="58" y="496" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Позиция после </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">k</tspan><tspan>-го дня:</tspan></text><text x="58" y="534" font-size="21" font-weight="500" fill="#d1d1d6"><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">f(k) = k·A − B·k(k−1)/2</tspan></text><circle cx="40" cy="565" r="4" fill="#ff9f0a"/><text x="58" y="572" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Растёт, пока </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">k·B &lt; A</tspan><tspan>, поэтому</tspan></text><text x="58" y="610" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>максимум при </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">k = ⌈A/B⌉</tspan><tspan> — за </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">O(1)</tspan></text><circle cx="40" cy="641" r="4" fill="#ff9f0a"/><text x="58" y="648" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Осталось читать </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">Q</tspan><tspan> пар вместо одной</tspan></text><rect x="610.5" y="350.5" width="589" height="329" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><rect x="642" y="382" width="64" height="64" rx="16.64" fill="url(#gdone)"/><rect x="642.5" y="382.5" width="63" height="63" rx="16.64" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><text x="674.0" y="425.52" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">D</text><text x="726" y="410" font-size="26" font-weight="600" fill="#f5f5f7">Чат-бот на калькуляторе</text><text x="726" y="440" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#86868b">O(N · log N)</text><circle cx="650" cy="489" r="4" fill="#30d158"/><text x="668" y="496" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Перебираем все числа от </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">0</tspan><tspan> до </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">N</tspan></text><circle cx="650" cy="527" r="4" fill="#30d158"/><text x="668" y="534" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Обычный вид: цифры </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">⊆ {0,1,5,8}</tspan></text><circle cx="650" cy="565" r="4" fill="#30d158"/><text x="668" y="572" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Перевёрнутый: цифры </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">⊆ {0,1,3,5,7,8}</tspan></text><circle cx="650" cy="603" r="4" fill="#30d158"/><text x="668" y="610" font-size="21" font-weight="500" fill="#d1d1d6"><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">N ≤ 123 456</tspan><tspan> — перебор с запасом</tspan></text>
</g>
</svg>
