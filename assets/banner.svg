<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="olymp — олимпиадное программирование">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1224"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="440" rx="24"/>
    </clipPath>
    <clipPath id="typing">
      <rect x="444" y="325" width="0" height="28">
        <animate attributeName="width" begin="0.8s" dur="1.52s" fill="freeze" calcMode="discrete"
          values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>

    <!-- цветные пятна света -->
    <circle cx="250" cy="370" r="190" fill="#6366f1" opacity="0.45" filter="url(#blur)">
      <animate attributeName="cx" values="250;330;250" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="970" cy="80" r="170" fill="#ec4899" opacity="0.32" filter="url(#blur)">
      <animate attributeName="cy" values="80;140;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="450" r="150" fill="#06b6d4" opacity="0.22" filter="url(#blur)">
      <animate attributeName="cx" values="660;560;660" dur="16s" repeatCount="indefinite"/>
    </circle>

    <rect width="1200" height="440" fill="url(#dots)"/>

    <!-- фоновые обрывки кода -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1" fill-opacity="0.13">
      <text x="72" y="128">dp[i][j]</text>
      <text x="118" y="232">O(n log n)</text>
      <text x="64" y="330">while (l &lt; r)</text>
      <text x="1000" y="150">mod 1e9+7</text>
      <text x="948" y="252">bfs(graph)</text>
      <text x="1002" y="352">a[mid] &lt; x</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- заголовок окна -->
    <rect width="1200" height="60" fill="#ffffff" fill-opacity="0.03"/>
    <line x1="0" y1="60.5" x2="1200" y2="60.5" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="34" cy="30" r="7" fill="#ff5f57"/>
    <circle cx="58" cy="30" r="7" fill="#febc2e"/>
    <circle cx="82" cy="30" r="7" fill="#28c840"/>
    <text x="600" y="35" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#64748b">a1tvv@olymp: ~/contests</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- логотип -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="-5" text-anchor="middle">
    <text x="600" y="212" fill="url(#word)" filter="url(#glow)" opacity="0.55">olymp</text>
    <text x="600" y="212" fill="url(#word)">olymp</text>
  </g>
  <text x="600" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#94a3b8" letter-spacing="0.5">Олимпиадное программирование · ICPC · C++ &amp; Python</text>

  <!-- терминал -->
  <rect x="390" y="304" width="420" height="96" rx="14" fill="#000000" fill-opacity="0.38" stroke="#ffffff" stroke-opacity="0.09"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="420" y="345" fill="#4ade80" font-weight="700">$</text>
    <text x="444" y="345" fill="#e2e8f0" textLength="228" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing)">./solve &lt; tests.txt</text>
    <rect x="444" y="328" width="11" height="22" fill="#e2e8f0">
      <animate attributeName="x" begin="0.8s" dur="1.52s" fill="freeze" calcMode="discrete"
        values="444;456;468;480;492;504;516;528;540;552;564;576;588;600;612;624;636;648;660;672"/>
      <set attributeName="visibility" to="hidden" begin="2.6s"/>
    </rect>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.35s" fill="freeze"/>
      <text x="420" y="378" textLength="348" lengthAdjust="spacingAndGlyphs"><tspan fill="#4ade80" font-weight="700">✓ Accepted</tspan><tspan fill="#64748b"> · all tests passed</tspan></text>
      <rect x="774" y="361" width="11" height="22" fill="#e2e8f0">
        <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
