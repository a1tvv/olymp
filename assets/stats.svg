<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Решено задач: 4. Контестов: 1. Языки: C++17, Python 3. Скоро: C, E, H">
  <defs>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f0a"/>
      <stop offset="0.4" stop-color="#ff375f"/>
      <stop offset="0.75" stop-color="#bf5af2"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.2" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8e8e93"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161618"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="t1"><rect width="590" height="540" rx="32"/></clipPath>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600">

    <!-- 1. Решено задач -->
    <g clip-path="url(#t1)">
      <rect width="590" height="540" fill="url(#tile)"/>
      <circle cx="470" cy="470" r="150" fill="url(#ai)" opacity="0.35" filter="url(#blur)"/>
    </g>
    <rect x="0.5" y="0.5" width="589" height="539" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="48" y="86" font-size="24" fill="#86868b">Решено задач</text>
    <g font-size="360" font-weight="700" letter-spacing="-10" fill="url(#ai)">
      <!-- отсчёт 1 → 2 → 3 → 4; без анимации сразу видна итоговая цифра -->
      <text x="30" y="420" opacity="0">1<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" calcMode="discrete" dur="0.8s" fill="freeze"/></text>
      <text x="30" y="420" opacity="0">2<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.75" calcMode="discrete" dur="0.8s" fill="freeze"/></text>
      <text x="30" y="420" opacity="0">3<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;0.999" calcMode="discrete" dur="0.8s" fill="freeze"/></text>
      <text x="30" y="420">4<animate attributeName="opacity" values="0;1" keyTimes="0;0.999" calcMode="discrete" dur="0.8s" fill="freeze"/></text>
    </g>
    <text x="48" y="490" font-size="22" fill="#86868b">3 — контест ICPC  ·  1 — алгоритмы</text>

    <!-- 2. Контесты -->
    <rect x="610.5" y="0.5" width="589" height="259" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="658" y="86" font-size="24" fill="#86868b">Контесты</text>
    <text x="650" y="218" font-size="150" font-weight="700" letter-spacing="-4" fill="url(#blue)">1</text>
    <text x="1152" y="170" font-size="32" font-weight="700" fill="#f5f5f7" text-anchor="end">ICPC NERC</text>
    <text x="1152" y="208" font-size="22" fill="#86868b" text-anchor="end">Kyrgyzstan Qualification · 2026</text>

    <!-- 3. Языки -->
    <rect x="610.5" y="280.5" width="284" height="259" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="646" y="344" font-size="24" fill="#86868b">Языки</text>
    <text x="644" y="440" font-size="58" font-weight="700" letter-spacing="-1" fill="url(#titanium)">C++17</text>
    <text x="646" y="490" font-size="32" fill="#86868b">Python 3</text>

    <!-- 4. Скоро -->
    <rect x="915.5" y="280.5" width="284" height="259" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="951" y="344" font-size="24" fill="#ff9f0a">Скоро</text>
    <g font-size="30" font-weight="700" fill="#f5f5f7" text-anchor="middle">
      <rect x="951" y="378" width="60" height="60" rx="16" fill="#1c1c1e" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="1023" y="378" width="60" height="60" rx="16" fill="#1c1c1e" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="1095" y="378" width="60" height="60" rx="16" fill="#1c1c1e" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="981" y="419">C</text>
      <text x="1053" y="419">E</text>
      <text x="1125" y="419">H</text>
    </g>
    <text x="951" y="490" font-size="22" fill="#86868b">в работе</text>
  </g>
</svg>
